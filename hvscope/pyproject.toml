[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvscope"
version = "0.1.0"
description = "Read a machine's screen through a camera and serve it as text an agent can consume."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Only needed for the `serial` source on Windows; POSIX has a termios fallback.
serial = ["pyserial>=3.5"]
dev = ["pytest>=7.4", "pyserial>=3.5"]

[project.scripts]
hvscope = "hvscope.cli:main"

[tool.setuptools.packages.find]
include = ["hvscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
